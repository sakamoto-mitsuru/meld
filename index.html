<h2 style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; align-items: baseline; gap: 12px"><span style="color: #2F4A6E">01</span>見積の前提</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="e-plan" class="fl">葬儀プラン</label><select id="e-plan" data-k="f47" value="{{fv.f47}}" onChange="{{onF}}"><option value="">選択してください</option><option>直葬プラン</option><option>一日葬プラン</option><option>家族葬プラン</option><option>一般葬プラン</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">葬儀形式</span><div style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 8px; background: #F5F7FA; border: 1px solid #DCE1E8; font-size: 14px">{{form}}</div><span class="hint">葬家登録で設定</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="e-no" class="fl">見積番号</label><input id="e-no" type="text" readonly="" placeholder="見積作成時に自動採番"></div>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; align-items: baseline; gap: 12px"><span style="color: #2F4A6E">02</span>見積に自動で反映される項目</h2>
<div style="overflow-x: auto">
<div role="table" aria-label="見積に反映される項目" style="min-width: 560px; max-width: 900px; display: flex; flex-direction: column">
<div role="row" style="display: grid; grid-template-columns: minmax(200px, 2fr) minmax(140px, 1fr) minmax(140px, 1fr); gap: 12px; padding: 0 4px 8px; font-size: 12px; font-weight: 700; color: #4A5260"><span role="columnheader">項目</span><span role="columnheader" style="text-align: right">内容</span><span role="columnheader">反映元</span></div>
<div role="row" style="display: grid; grid-template-columns: minmax(200px, 2fr) minmax(140px, 1fr) minmax(140px, 1fr); gap: 12px; padding: 10px 4px; border-top: 1px solid #E6EAF0; font-size: 14px"><span role="cell">寝台車・霊柩車（運賃計算距離の合計）</span><span role="cell" style="text-align: right; font-weight: 700; font-variant-numeric: tabular-nums">{{allFareKm}}</span><span role="cell" class="hint">搬送登録</span></div>
<div role="row" style="display: grid; grid-template-columns: minmax(200px, 2fr) minmax(140px, 1fr) minmax(140px, 1fr); gap: 12px; padding: 10px 4px; border-top: 1px solid #E6EAF0; font-size: 14px"><span role="cell">安置日数</span><span role="cell" style="text-align: right; font-weight: 700; font-variant-numeric: tabular-nums">[日数]日</span><span role="cell" class="hint">搬送登録・葬家登録</span></div>
<div role="row" style="display: grid; grid-template-columns: minmax(200px, 2fr) minmax(140px, 1fr) minmax(140px, 1fr); gap: 12px; padding: 10px 4px; border-top: 1px solid #E6EAF0; font-size: 14px"><span role="cell">式場</span><span role="cell" style="text-align: right; font-weight: 700">{{venue}}</span><span role="cell" class="hint">葬家登録</span></div>
</div></div>
</section>

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px"><h2 style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; align-items: baseline; gap: 12px"><span style="color: #2F4A6E">03</span>セレモニープレビューの選択結果</h2><span style="{{cpStateStyle}}">{{cpState}}</span></div>
<span class="hint" style="margin-top: -8px">{{cpSub}}</span>
<sc-if value="{{cpHas}}" hint-placeholder-val="{{ true }}">
<div style="overflow-x: auto"><div role="table" aria-label="セレモニープレビューで選んだ商品" style="min-width: 820px; display: flex; flex-direction: column">
<div role="row" style="display: grid; grid-template-columns: 100px 110px minmax(200px, 1.6fr) minmax(140px, 1fr) 60px 70px 130px; gap: 12px; padding: 10px 14px; background: #F5F7FA; border-bottom: 1px solid #DCE1E8; font-size: 12px; font-weight: 700; color: #4A5260"><span role="columnheader">分類</span><span role="columnheader">商品コード</span><span role="columnheader">商品名</span><span role="columnheader">組み合わせ</span><span role="columnheader" style="text-align: right">数量</span><span role="columnheader" style="text-align: right">税率</span><span role="columnheader" style="text-align: right">販売価格（税込）</span></div>
<sc-for list="{{cpItems}}" as="cpi" hint-placeholder-count="4"><div role="row" style="display: grid; grid-template-columns: 100px 110px minmax(200px, 1.6fr) minmax(140px, 1fr) 60px 70px 130px; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #E6EAF0; font-size: 14px"><span role="cell"><span style="display: inline-flex; padding: 1px 8px; border-radius: 4px; background: #E6EDF6; color: #1E3352; font-size: 12px; font-weight: 700">{{cpi.cat}}</span></span><span role="cell" style="font-variant-numeric: tabular-nums; color: #4A5260">{{cpi.code}}</span><span role="cell" style="font-weight: 700">{{cpi.name}}</span><span role="cell" class="hint">{{cpi.link}}</span><span role="cell" style="text-align: right; font-variant-numeric: tabular-nums">{{cpi.qty}}</span><span role="cell" style="text-align: right; font-variant-numeric: tabular-nums">{{cpi.tax}}</span><span role="cell" style="text-align: right; font-variant-numeric: tabular-nums">{{cpi.price}}</span></div></sc-for>
<div role="row" style="display: grid; grid-template-columns: 100px 110px minmax(200px, 1.6fr) minmax(140px, 1fr) 60px 70px 130px; gap: 12px; padding: 12px 14px; font-size: 14px; font-weight: 700"><span role="cell" style="grid-column: 1 / 7; text-align: right">合計（税込）</span><span role="cell" style="text-align: right; font-variant-numeric: tabular-nums">{{cpTotal}}</span></div>
</div></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px"><button type="button" disabled="" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #C3CBD6; background: #F1F3F6; color: #8A93A1; font: inherit; font-size: 14px; font-weight: 700; cursor: not-allowed">見積に取り込む（見積登録の仕様決定後）</button><button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">プレビュー画像を見る</button></div>
</sc-if>
<p class="hint" style="margin: 0">選択結果はitowa（セレモニープレビュー）から送られた内容を表示しています（閲覧のみ）。価格は選択した時点の販売価格です。商品の追加・変更やご遺族との選び直しは、itowa管理画面のセレモニープレビューで行います。</p>
</section>

</sc-if>

<div style="position: sticky; bottom: 12px; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; box-shadow: 0 6px 20px rgba(43,48,56,0.14)">
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-if value="{{hasPrev}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{goPrev}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 14px; cursor: pointer">← {{prevLabel}}</button>
</sc-if>
<sc-if value="{{hasNext}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{goNext}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{nextLabel}} →</button>
</sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span role="status" style="{{saveTextStyle}}">{{saveText}}</span>
<sc-if value="{{showTemp}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{doTempSave}}" style="min-height: 44px; padding: 0 22px; border-radius: 8px; border: 1px solid #1F6FD1; background: #FFFFFF; color: #1A5DB0; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">一時保存</button></sc-if>
<sc-if value="{{obitDirty}}" hint-placeholder-val="{{ false }}"><span role="status" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #FBF3D6; border: 1px solid #E9C55A; color: #5E4A0E; font-size: 12px; font-weight: 700">訃報に未反映の変更があります</span></sc-if><sc-if value="{{showObitLink}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{doObitLink}}" style="min-height: 44px; padding: 0 22px; border-radius: 8px; border: 1px solid #2F4A6E; background: #E6EDF6; color: #1E3352; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{obitLinkLabel}}</button></sc-if>
<button type="button" onClick="{{doSave}}" disabled="{{saveBlocked}}" style="{{saveStyle}}">{{saveLabel}}</button>
<sc-if value="{{showConfirm}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{doConfirm}}" style="min-height: 44px; padding: 0 28px; border-radius: 8px; border: none; background: #2F4A6E; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">確定</button></sc-if>
<sc-if value="{{showUnconfirm}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{askUnconfirm}}" style="min-height: 44px; padding: 0 20px; border-radius: 8px; border: 1px solid #B4443A; background: #FFFFFF; color: #9A2F26; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">確定を取り消す</button></sc-if>
</div>
</div>

<sc-if value="{{showHistory}}" hint-placeholder-val="{{ false }}"><div role="dialog" aria-labelledby="hist-h" style="position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); z-index: 30; background: #FFFFFF; box-shadow: -8px 0 24px rgba(43,48,56,0.18); display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px; border-bottom: 1px solid #DCE1E8"><h2 id="hist-h" style="margin: 0; font-size: 17px; font-weight: 700">更新履歴</h2><button type="button" onClick="{{closeHistory}}" aria-label="更新履歴を閉じる" style="width: 40px; height: 40px; border-radius: 8px; border: 1px solid #C3CBD6; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 18px; cursor: pointer">×</button></div>
<p class="hint" style="margin: 0; padding: 12px 20px; background: #F7F9FB; border-bottom: 1px solid #E6EAF0">同じ受付を複数人で開いている場合は、画面上部に編集中の人を表示します。保存時に他の人と同じ項目を変更していた場合だけ、どちらの内容を残すか確認します。</p>
<div style="flex: 1; overflow-y: auto">
<sc-for list="{{histRows}}" as="hr" hint-placeholder-count="5"><div style="display: flex; flex-direction: column; gap: 3px; padding: 14px 20px; border-bottom: 1px solid #E6EAF0"><div style="display: flex; justify-content: space-between; gap: 10px"><span style="font-size: 14px; font-weight: 700">{{hr.who}}</span><span class="hint" style="font-variant-numeric: tabular-nums">{{hr.at}}</span></div><span class="hint">{{hr.where}}</span><span style="font-size: 13px; line-height: 1.6">{{hr.what}}</span></div></sc-for>
</div>
</div></sc-if>
<sc-if value="{{saveModal}}" hint-placeholder-val="{{ false }}"><div style="position: fixed; inset: 0; z-index: 40; background: rgba(43,48,56,0.45); display: flex; align-items: center; justify-content: center; padding: 20px">
<div role="dialog" aria-modal="true" aria-labelledby="sm-h" style="width: min(460px, 100%); background: #FFFFFF; border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); padding: 26px 24px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px"><span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #E3F0EC; color: #1F4A42; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span><h2 id="sm-h" style="margin: 0; font-size: 18px; font-weight: 700">{{smTitle}}</h2></div>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #2B3038">{{smBody}}</p>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
<sc-if value="{{smHasNext}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{smNext}}" style="width: 100%; min-height: 50px; border-radius: 10px; border: none; background: #2F4A6E; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{smNextLabel}} →</button></sc-if>
<button type="button" onClick="{{smList}}" style="width: 100%; min-height: 50px; border-radius: 10px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">施行一覧に戻る</button>
<button type="button" onClick="{{smClose}}" style="align-self: center; min-height: 40px; padding: 0 12px; border: none; background: transparent; color: #4A5260; font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer">このまま編集を続ける</button>
</div>
</div>
</div></sc-if>
</sc-if>

<!-- ============ 施行一覧 ============ -->
<sc-if value="{{isList}}" hint-placeholder-val="{{ false }}">
<div style="padding-top: 24px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><span class="hint">進行中の受付を新しい順に表示</span><div style="display: flex; align-items: baseline; gap: 14px"><h1 style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 26px; font-weight: 700; letter-spacing: 0.04em">施行一覧</h1><span style="font-size: 14px; color: #4A5260"><span style="font-weight: 700; font-variant-numeric: tabular-nums">{{listCount}}</span> 件</span></div></div>
<button type="button" onClick="{{goNewForm}}" style="min-height: 44px; padding: 0 22px; border-radius: 8px; border: none; background: {{accent}}; color: #2B3038; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">＋ 葬儀登録（新規）</button>
</div>
<sc-if value="{{showAdded}}" hint-placeholder-val="{{ false }}"><div role="status" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-radius: 10px; background: #E3F0EC; border: 1px solid #9CC9BE; color: #1F4A42; font-size: 14px"><span><span style="font-weight: 700">{{addedHead}}</span>{{addedTail}}</span><button type="button" onClick="{{closeAdded}}" aria-label="お知らせを閉じる" style="min-height: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid #9CC9BE; background: #FFFFFF; color: #1F4A42; font: inherit; font-size: 13px; cursor: pointer">閉じる</button></div></sc-if>


<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px">
<fieldset><legend>日付で絞り込み</legend>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px">
<div style="display: flex; flex-direction: column; gap: 6px; flex: 0 1 150px"><label for="l-kind" class="fl">日付の種類</label><select id="l-kind" value="{{lDateKind}}" onChange="{{setLDateKind}}"><option value="sogi">葬儀日</option><option value="recv">受付日</option><option value="death">死亡日</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px; flex: 0 1 340px"><span class="fl" id="l-period">期間</span><div role="group" aria-labelledby="l-period" style="display: flex; align-items: center; gap: 6px"><input type="date" aria-label="期間の開始" value="{{lFrom}}" onChange="{{setLFrom}}"><span class="unit">〜</span><input type="date" aria-label="期間の終了" value="{{lTo}}" onChange="{{setLTo}}"></div></div>
<div role="group" aria-label="期間のワンタッチ指定" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{presets}}" as="pr" hint-placeholder-count="4"><button type="button" onClick="{{pr.pick}}" aria-pressed="{{pr.on}}" style="{{pr.style}}">{{pr.label}}</button></sc-for>
</div>
<label class="chk"><input type="checkbox" checked="{{lUndated}}" onChange="{{toggleLUndated}}">日付未定を含める</label>
</div>
<p class="hint" style="margin: 10px 0 0">期間を指定しない場合は、葬儀日が今日以降または未定の受付のみ表示します（葬儀日の翌日からは一覧に出ません）。終了した受付は、期間を指定して検索してください。</p>
</fieldset>
<fieldset><legend>条件で絞り込み</legend>
<div style="display: grid; grid-template-columns: minmax(240px, 2fr) repeat(3, minmax(170px, 1fr)); gap: 12px 16px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="l-q" class="fl">キーワード</label><input id="l-q" type="text" autocomplete="off" placeholder="故人名・ふりがな・喪主名・施行番号" value="{{qList}}" onChange="{{setQList}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="l-venue" class="fl">式場</label><select id="l-venue" value="{{lVenue}}" onChange="{{setLVenue}}"><option value="">すべて</option><option>平池斎場</option><option>CCVN CHECK TOWN</option><option>パシフィコ横浜</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">担当者（打合せ・搬送）</span>
<sc-if value="{{hasLStaff}}" hint-placeholder-val="{{ false }}"><div><span style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 4px 0 14px; border-radius: 999px; background: #2F4A6E; color: #FFFFFF; font-size: 14px; font-weight: 700">{{lStaff}}<button type="button" aria-label="担当者の条件を外す" onClick="{{clearLStaff}}" style="width: 32px; height: 32px; border: none; border-radius: 999px; background: transparent; color: #FFFFFF; font: inherit; font-size: 16px; cursor: pointer">×</button></span></div></sc-if>
<sc-if value="{{noLStaff}}" hint-placeholder-val="{{ true }}"><div style="position: relative">
<input type="text" aria-label="担当者を検索" autocomplete="off" placeholder="名前・ふりがなで検索" value="{{qLStaff}}" onChange="{{setQLStaff}}">
<sc-if value="{{showLStaff}}" hint-placeholder-val="{{ false }}"><div role="listbox" aria-label="担当者の候補" style="position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 4; display: flex; flex-direction: column; padding: 4px; background: #FFFFFF; border: 1px solid #C3CBD6; border-radius: 10px; box-shadow: 0 8px 20px rgba(43,48,56,0.16); max-height: 260px; overflow-y: auto">
<sc-for list="{{lStaffHits}}" as="lh" hint-placeholder-count="3"><button type="button" role="option" onClick="{{lh.pick}}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; padding: 0 10px; border: none; border-radius: 6px; background: transparent; color: #2B3038; font: inherit; font-size: 14px; text-align: left; cursor: pointer"><span style="font-weight: 700">{{lh.name}}</span><span class="hint">{{lh.kana}}</span></button></sc-for>
<sc-if value="{{lStaffNoHit}}" hint-placeholder-val="{{ false }}"><span class="hint" style="padding: 10px">該当する担当者がいません</span></sc-if>
</div></sc-if>
</div></sc-if>
</div>
</div>
<label class="chk" style="margin-top: 6px"><input type="checkbox" checked="{{lCanceled}}" onChange="{{toggleLCanceled}}">取り消した受付を含める</label>
</fieldset>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px"><sc-if value="{{lDirty}}" hint-placeholder-val="{{ false }}"><span role="status" style="font-size: 13px; font-weight: 700; color: #8A4B00">条件を変更しました。「検索」を押すと反映されます</span></sc-if><button type="button" onClick="{{clearListFilters}}" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 14px; cursor: pointer">条件をクリア</button><button type="button" onClick="{{runListSearch}}" style="min-height: 44px; padding: 0 28px; border-radius: 8px; border: none; background: #2F4A6E; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>検索</button></div>
</section>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
<span style="font-size: 14px; color: #4A5260">該当 <span style="font-weight: 700; font-variant-numeric: tabular-nums">{{listCount}}</span> 件</span>
<div style="display: flex; align-items: center; gap: 8px"><label for="l-sort" class="fl">並び順</label><select id="l-sort" value="{{lSort}}" onChange="{{setLSort}}" style="width: 220px"><option value="recv">受付日の新しい順</option><option value="sogi">葬儀日の近い順（未定を先頭）</option></select></div>
</div>

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; overflow: hidden">
<div style="overflow-x: auto">
<div role="table" aria-label="施行一覧" style="min-width: 1380px; display: flex; flex-direction: column">
<div role="row" style="display: grid; grid-template-columns: 130px 110px minmax(170px, 1.2fr) 210px minmax(160px, 1fr) 150px 130px 180px; gap: 12px; align-items: center; padding: 12px 18px; background: #F5F7FA; border-bottom: 1px solid #DCE1E8; font-size: 12px; font-weight: 700; color: #4A5260">
<span role="columnheader">施行番号</span><span role="columnheader">受付日時</span><span role="columnheader">故人名</span><span role="columnheader">進み具合・次の作業</span><span role="columnheader">式場</span><span role="columnheader">葬儀日（直葬は火葬日）</span><span role="columnheader">打合せ担当</span><span role="columnheader">訃報</span>
</div>
<sc-for list="{{listRows}}" as="lr" hint-placeholder-count="6">
<div role="row" style="display: grid; grid-template-columns: 130px 110px minmax(170px, 1.2fr) 210px minmax(160px, 1fr) 150px 130px 180px; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid #E6EAF0; font-size: 14px">
<span role="cell" style="font-variant-numeric: tabular-nums; color: #4A5260">{{lr.no}}</span>
<span role="cell" style="font-variant-numeric: tabular-nums">{{lr.at}}</span>
<span role="cell" style="display: flex; flex-direction: column; gap: 2px"><a href="#" onClick="{{lr.open}}" style="font-weight: 700; color: #2F4A6E; text-decoration: underline; text-underline-offset: 3px">{{lr.name}}</a><span class="hint">{{lr.kana}}</span><sc-if value="{{lr.isTOnly}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; padding: 0 8px; border-radius: 4px; background: #E6EDF6; color: #1E3352; font-size: 11px; font-weight: 700; line-height: 20px">{{lr.tagText}}</span></sc-if></span>
<span role="cell" style="display: flex; flex-direction: column; gap: 4px"><span aria-label="{{lr.progressAria}}" style="display: flex; gap: 3px"><sc-for list="{{lr.bars}}" as="bb" hint-placeholder-count="4"><span style="{{bb.style}}"></span></sc-for></span><span style="{{lr.nextStyle}}">{{lr.next}}</span></span>
<span role="cell">{{lr.venueDisp}}</span>
<span role="cell" style="{{lr.schedStyle}}">{{lr.sogiDisp}}</span>
<span role="cell">{{lr.staff}}</span>
<span role="cell" style="display: flex; gap: 6px; align-items: center"><sc-if value="{{lr.linked}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{lr.pdf}}" aria-label="{{lr.pdfAria}}" style="min-height: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer">訃報紙PDF</button><button type="button" onClick="{{lr.sms}}" aria-label="{{lr.smsAria}}" style="min-height: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer">SMS送信</button></sc-if><sc-if value="{{lr.notLinked}}" hint-placeholder-val="{{ false }}"><span class="hint">未連携</span></sc-if></span>
</div>
</sc-for>
<sc-if value="{{listEmpty}}" hint-placeholder-val="{{ false }}"><div style="padding: 32px 18px; text-align: center; font-size: 14px; color: #4A5260">該当する受付はありません</div></sc-if>
</div></div>
</section>
<p class="hint" style="margin: 0">逝去登録を保存すると、この一覧に追加されます。故人名を押すと、次に入力する段階の登録画面を開きます（搬送担当者は、担当した葬家を選んで搬送登録を入力）。一覧の行は仮のデータです。</p>
</sc-if>

<!-- ============ マスタ設定 ============ -->
<sc-if value="{{isMaster}}" hint-placeholder-val="{{ false }}">
<div style="padding-top: 24px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><span class="hint">設定</span><h1 style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 26px; font-weight: 700; letter-spacing: 0.04em">{{mTitle}}</h1><span class="hint">{{mDesc}}</span></div>
<sc-if value="{{mHasNew}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{mNew}}" style="min-height: 44px; padding: 0 22px; border-radius: 8px; border: none; background: {{accent}}; color: #2B3038; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">＋ 新規作成</button>
</div></sc-if>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: #EEF2F8; border: 1px solid #B9C9DD; font-size: 13px; color: #1E3352; line-height: 1.6"><span aria-hidden="true" style="flex: none; font-weight: 700">連携</span><span>{{mSyncNote}}</span></div>

<!-- 一覧 -->
<sc-if value="{{mShowList}}" hint-placeholder-val="{{ true }}">
<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 320px"><label for="m-q" class="fl">{{mQLabel}}</label><input id="m-q" type="text" autocomplete="off" value="{{mQ}}" onChange="{{setMQ}}" placeholder="名前の一部で絞り込み"></div>
<span class="hint" style="padding-bottom: 12px">{{mCount}} 件</span>
</section>
<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; overflow: hidden">
<div style="overflow-x: auto"><div role="table" aria-label="{{mTitle}}" style="min-width: 900px; display: flex; flex-direction: column">
<div role="row" style="{{mHeadStyle}}"><sc-for list="{{mCols}}" as="mc" hint-placeholder-count="5"><span role="columnheader" style="{{mc.style}}">{{mc.label}}</span></sc-for></div>
<sc-for list="{{mRows}}" as="mr" hint-placeholder-count="4"><div role="row" style="{{mRowStyle}}">
<span role="cell"><a href="#" onClick="{{mr.open}}" style="font-weight: 700; color: #2F4A6E; text-decoration: underline; text-underline-offset: 3px">{{mr.first}}</a></span>
<sc-for list="{{mr.cells}}" as="mx" hint-placeholder-count="4"><span role="cell" style="{{mx.style}}">{{mx.text}}</span></sc-for>
</div></sc-for>
<sc-if value="{{mEmpty}}" hint-placeholder-val="{{ false }}"><div style="padding: 28px 18px; text-align: center; font-size: 14px; color: #4A5260">該当するデータはありません</div></sc-if>
</div></div>
</section>
</sc-if>

<!-- 会場フォーム -->
<sc-if value="{{mShowHallForm}}" hint-placeholder-val="{{ false }}">
<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">{{mFormTitle}}</h2>
<sc-if value="{{mEditWarn}}" hint-placeholder-val="{{ false }}"><div role="status" style="padding: 12px 16px; border-radius: 10px; background: #FBF3D6; border: 1px solid #E9C55A; color: #5E4A0E; font-size: 13px; line-height: 1.6">{{mEditWarnText}}</div></sc-if>
<fieldset><legend>基本情報</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-name" class="fl">会場名<span class="req">必須</span></label><input id="h-name" type="text" data-d="name" value="{{d.name}}" onChange="{{onD}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-tel" class="fl">問い合わせ電話番号<span class="req">必須</span></label><input id="h-tel" type="tel" data-d="tel" value="{{d.tel}}" onChange="{{onD}}" placeholder="03-1234-5678"></div>
</div>
<div style="display: grid; grid-template-columns: minmax(140px, 0.7fr) minmax(140px, 0.8fr) minmax(180px, 1fr) minmax(180px, 1fr); gap: 14px 18px; margin-top: 14px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-zip" class="fl">郵便番号<span class="req">必須</span></label><input id="h-zip" type="text" inputmode="numeric" data-d="zip" value="{{d.zip}}" onChange="{{onDZip}}" placeholder="例）466-0064"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-pref" class="fl">都道府県<span class="req">必須</span></label><select id="h-pref" data-d="pref" value="{{d.pref}}" onChange="{{onD}}"><option value="">選択</option><option>北海道</option><option>青森県</option><option>岩手県</option><option>宮城県</option><option>秋田県</option><option>山形県</option><option>福島県</option><option>茨城県</option><option>栃木県</option><option>群馬県</option><option>埼玉県</option><option>千葉県</option><option>東京都</option><option>神奈川県</option><option>新潟県</option><option>富山県</option><option>石川県</option><option>福井県</option><option>山梨県</option><option>長野県</option><option>岐阜県</option><option>静岡県</option><option>愛知県</option><option>三重県</option><option>滋賀県</option><option>京都府</option><option>大阪府</option><option>兵庫県</option><option>奈良県</option><option>和歌山県</option><option>鳥取県</option><option>島根県</option><option>岡山県</option><option>広島県</option><option>山口県</option><option>徳島県</option><option>香川県</option><option>愛媛県</option><option>高知県</option><option>福岡県</option><option>佐賀県</option><option>長崎県</option><option>熊本県</option><option>大分県</option><option>宮崎県</option><option>鹿児島県</option><option>沖縄県</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-city" class="fl">市区郡<span class="req">必須</span></label><input id="h-city" type="text" data-d="city" value="{{d.city}}" onChange="{{onD}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-town" class="fl">町村<span class="req">必須</span></label><input id="h-town" type="text" data-d="town" value="{{d.town}}" onChange="{{onD}}"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 14px"><label for="h-addr" class="fl">住所（番地・建物名）<span class="req">必須</span></label><input id="h-addr" type="text" data-d="addr" value="{{d.addr}}" onChange="{{onD}}"><span class="hint">郵便番号を入力すると、都道府県・市区郡・町村まで自動で入ります。</span></div>
</fieldset>
<fieldset><legend>部屋リスト・説明</legend>
<div style="display: grid; grid-template-columns: minmax(220px, 1fr) minmax(260px, 1.4fr); gap: 14px 18px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-rooms" class="fl">部屋リスト</label><textarea id="h-rooms" data-d="rooms" value="{{d.rooms}}" onChange="{{onD}}" placeholder="1行に1部屋（例：大ホール）"></textarea><span class="hint">葬家登録で、式場の部屋として選べます。</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-desc" class="fl">説明</label><textarea id="h-desc" data-d="desc" value="{{d.desc}}" onChange="{{onD}}" placeholder="駐車場・アクセスなど、訃報ページに表示する案内"></textarea></div>
</div>
</fieldset>
<fieldset><legend>受注・振込先情報</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 18px">

<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-fax" class="fl">受注FAX番号（会場用）</label><input id="h-fax" type="tel" data-d="fax" value="{{d.fax}}" onChange="{{onD}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-mail" class="fl">受注メールアドレス</label><input id="h-mail" type="email" data-d="mail" value="{{d.mail}}" onChange="{{onD}}"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px 18px; margin-top: 14px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-bank" class="fl">銀行名</label><input id="h-bank" type="text" data-d="bank" value="{{d.bank}}" onChange="{{onD}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-branch" class="fl">支店名</label><input id="h-branch" type="text" data-d="branch" value="{{d.branch}}" onChange="{{onD}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-acct" class="fl">口座番号</label><input id="h-acct" type="text" inputmode="numeric" data-d="acct" value="{{d.acct}}" onChange="{{onD}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-acctname" class="fl">口座名義（カナ）</label><input id="h-acctname" type="text" data-d="acctName" value="{{d.acctName}}" onChange="{{onD}}"></div>
</div>
<div style="display: grid; grid-template-columns: minmax(200px, 1fr) minmax(260px, 1.6fr); gap: 14px 18px; margin-top: 14px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-due" class="fl">支払期限について（30文字まで）</label><input id="h-due" type="text" maxlength="30" data-d="due" value="{{d.due}}" onChange="{{onD}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="h-inv" class="fl">請求書備考（80文字まで）</label><input id="h-inv" type="text" maxlength="80" data-d="inv" value="{{d.inv}}" onChange="{{onD}}"></div>
</div>
<p class="hint" style="margin: 8px 0 0">未入力の場合は、葬儀社設定の受注先・振込先を使います。</p>
</fieldset>
<div style="display: flex; justify-content: space-between; gap: 8px"><button type="button" onClick="{{mBack}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 14px; cursor: pointer">一覧に戻る</button><sc-if value="{{mCanSave}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{mSave}}" style="min-height: 44px; padding: 0 28px; border-radius: 8px; border: none; background: {{accent}}; color: #2B3038; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{mSaveLabel}}</button></sc-if></div>
</section>
</sc-if>

<!-- 車両フォーム -->
<sc-if value="{{mShowVehicleForm}}" hint-placeholder-val="{{ false }}">
<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px; max-width: 900px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">{{mFormTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="vh-name" class="fl">車両名<span class="req">必須</span></label><input id="vh-name" type="text" data-d="name" value="{{d.name}}" onChange="{{onD}}" placeholder="例）寝台車4号"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="vh-kind" class="fl">種別<span class="req">必須</span></label><select id="vh-kind" data-d="kind" value="{{d.kind}}" onChange="{{onD}}"><option>寝台車</option><option>霊柩車</option><option>その他</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="vh-garage" class="fl">車庫（出庫・帰庫の場所）<span class="req">必須</span></label><input id="vh-garage" type="text" data-d="garage" value="{{d.garage}}" onChange="{{onD}}" placeholder="例）本社車庫"><span class="hint">搬送登録の出庫・帰庫の場所に入ります</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="vh-plate" class="fl">ナンバー</label><input id="vh-plate" type="text" data-d="plate" value="{{d.plate}}" onChange="{{onD}}" placeholder="例）名古屋 800 さ 12-34"></div>
</div>
<div role="radiogroup" aria-label="利用" style="display: flex; gap: 0 24px"><sc-for list="{{vhUseOpts}}" as="vu" hint-placeholder-count="2"><label class="chk"><input type="radio" name="vh-use" checked="{{vu.on}}" onChange="{{vu.pick}}">{{vu.label}}</label></sc-for></div>
<span class="hint" style="margin-top: -10px">「停止中」にすると、搬送登録の車両の選択肢に出なくなります（登録済みの搬送はそのまま残ります）。</span>
<div style="display: flex; justify-content: space-between; gap: 8px"><button type="button" onClick="{{mBack}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 14px; cursor: pointer">一覧に戻る</button><button type="button" onClick="{{mSave}}" style="min-height: 44px; padding: 0 28px; border-radius: 8px; border: none; background: {{accent}}; color: #2B3038; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{mSaveLabel}}</button></div>
</section>
</sc-if>

<!-- 自社情報 -->
<sc-if value="{{mShowCompany}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 20px; max-width: 980px">
<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">会社情報</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="cp-name" class="fl">会社名（発行者名）<span class="req">必須</span></label><input id="cp-name" type="text" data-comp="name" value="{{cp2.name}}" onChange="{{onComp}}" placeholder="例）株式会社○○"></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="cp-brand" class="fl">屋号<span class="req">必須</span></label><input id="cp-brand" type="text" data-comp="brand" value="{{cp2.brand}}" onChange="{{onComp}}" placeholder="例）メモリード"><span class="hint">訃報連携のブランド名と、帳票の発行者名の下に使います</span></div></div>
<div style="display: grid; grid-template-columns: minmax(140px, 0.6fr) minmax(260px, 2fr); gap: 14px 18px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="cp-zip" class="fl">郵便番号<span class="req">必須</span></label><input id="cp-zip" type="text" inputmode="numeric" value="{{cp2.zip}}" onChange="{{onCompZip}}" placeholder="例）4536111"></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="cp-addr" class="fl">住所<span class="req">必須</span></label><input id="cp-addr" type="text" data-comp="addr" value="{{cp2.addr}}" onChange="{{onComp}}" placeholder="郵便番号から町名まで自動入力。番地以降を入力"></div></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="cp-bld" class="fl">建物名</label><input id="cp-bld" type="text" data-comp="bld" value="{{cp2.bld}}" onChange="{{onComp}}" placeholder=""></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="cp-tel" class="fl">電話番号<span class="req">必須</span></label><input id="cp-tel" type="tel" data-comp="tel" value="{{cp2.tel}}" onChange="{{onComp}}" placeholder=""></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="cp-fax" class="fl">FAX</label><input id="cp-fax" type="tel" data-comp="fax" value="{{cp2.fax}}" onChange="{{onComp}}" placeholder=""></div></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="cp-inv" class="fl">登録番号（インボイス）</label><input id="cp-inv" type="text" data-comp="inv" value="{{cp2.inv}}" onChange="{{onComp}}" placeholder="T＋13桁の数字"><span class="hint">{{compInvHint}}</span></div><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">社印（角印）</span><button type="button" style="min-height: 44px; border-radius: 8px; border: 1px dashed #8A96A8; background: #F5F7FA; color: #2F4A6E; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">画像を追加</button><span class="hint">PNG（背景透過）推奨。帳票の発行者名の右に表示</span></div></div>
</section>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px"><span role="status" class="hint">{{compSavedText}}</span><button type="button" onClick="{{compSave}}" style="min-height: 44px; padding: 0 28px; border-radius: 8px; border: none; background: {{accent}}; color: #2B3038; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">保存</button></div>
</div>
</sc-if>

<!-- ユーザーフォーム -->
<sc-if value="{{mShowUserForm}}" hint-placeholder-val="{{ false }}">
<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px; max-width: 900px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">{{mFormTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="us-name" class="fl">氏名<span class="req">必須</span></label><input id="us-name" type="text" data-d="name" value="{{d.name}}" onChange="{{onD}}" placeholder="例）鈴木 健二"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="us-kana" class="fl">ふりがな<span class="req">必須</span></label><input id="us-kana" type="text" data-d="kana" value="{{d.kana}}" onChange="{{onD}}" placeholder="例）すずき けんじ"><span class="hint">名前検索に使います</span></div>

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px">
<fieldset><legend>日付で絞り込み</legend>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px">
<div style="display: flex; flex-direction: column; gap: 6px; flex: 0 1 150px"><label for="o-kind2" class="fl">日付の種類</label><select id="o-kind2" value="{{oDateKind}}" onChange="{{setODateKind}}"><option value="sogi">葬儀日</option><option value="recv">受付日</option><option value="order">注文日</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px; flex: 0 1 340px"><span class="fl" id="o-period">期間</span><div role="group" aria-labelledby="o-period" style="display: flex; align-items: center; gap: 6px"><input type="date" aria-label="期間の開始" value="{{oFrom}}" onChange="{{setOFrom}}"><span class="unit">〜</span><input type="date" aria-label="期間の終了" value="{{oTo}}" onChange="{{setOTo}}"></div></div>
<div role="group" aria-label="期間のワンタッチ指定" style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{oPresets}}" as="opr" hint-placeholder-count="4"><button type="button" onClick="{{opr.pick}}" aria-pressed="{{opr.on}}" style="{{opr.style}}">{{opr.label}}</button></sc-for></div>
</div>
<p class="hint" style="margin: 10px 0 0">期間を指定しない場合は、施行一覧と同じく葬儀日が今日以降または未定の葬家を表示します。</p>
</fieldset>
<fieldset><legend>条件で絞り込み</legend>
<div style="display: grid; grid-template-columns: minmax(240px, 2fr) repeat(2, minmax(180px, 1fr)); gap: 12px 16px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="o-q" class="fl">キーワード</label><input id="o-q" type="text" autocomplete="off" placeholder="故人名・ふりがな・札名・注文者・注文番号" value="{{oQ}}" onChange="{{setOQ}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="o-venue" class="fl">式場</label><select id="o-venue" value="{{oVenue}}" onChange="{{setOVenue}}"><option value="">すべて</option><option>平池斎場</option><option>CCVN CHECK TOWN</option><option>パシフィコ横浜</option><option>東京ビックサイト</option><option value="__other">その他の会場</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="o-has" class="fl">注文の状況</label><select id="o-has" value="{{oHas}}" onChange="{{setOHas}}"><option value="">すべて</option><option value="any">注文あり</option><option value="web">訃報経由の注文あり</option><option value="manual">個別登録の注文あり</option><option value="none">注文なし</option><option value="unsettled">未精算あり</option></select></div>
</div>
</fieldset>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px"><sc-if value="{{oDirty}}" hint-placeholder-val="{{ false }}"><span role="status" style="font-size: 13px; font-weight: 700; color: #8A4B00">条件を変更しました。「検索」を押すと反映されます</span></sc-if><button type="button" onClick="{{oClear}}" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 14px; cursor: pointer">条件をクリア</button><button type="button" onClick="{{oSearch}}" style="min-height: 44px; padding: 0 28px; border-radius: 8px; border: none; background: #2F4A6E; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>検索</button></div>
</section>
<div style="font-size: 14px; color: #4A5260">該当 <span style="font-weight: 700; font-variant-numeric: tabular-nums">{{oFuneralCount}}</span> 件</div>
<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; overflow: hidden">
<div style="overflow-x: auto"><div role="table" aria-label="葬家ごとの注文" style="min-width: 960px; display: flex; flex-direction: column">
<div role="row" style="display: grid; grid-template-columns: 130px minmax(180px, 1.4fr) 180px minmax(160px, 1fr) 150px; gap: 12px; padding: 12px 18px; background: #F5F7FA; border-bottom: 1px solid #DCE1E8; font-size: 12px; font-weight: 700; color: #4A5260"><span role="columnheader">施行番号</span><span role="columnheader">故人名</span><span role="columnheader">葬儀日（直葬は火葬日）</span><span role="columnheader">式場</span><span role="columnheader">精算</span></div>
<sc-for list="{{oFunerals}}" as="ofn" hint-placeholder-count="4"><div role="row" style="display: grid; grid-template-columns: 130px minmax(180px, 1.4fr) 180px minmax(160px, 1fr) 150px; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid #E6EAF0; font-size: 14px"><span role="cell" style="font-variant-numeric: tabular-nums; color: #4A5260">{{ofn.no}}</span><span role="cell" style="display: flex; flex-direction: column; gap: 2px"><a href="#" onClick="{{ofn.open}}" style="font-weight: 700; color: #2F4A6E; text-decoration: underline; text-underline-offset: 3px">{{ofn.name}}</a><span class="hint">{{ofn.kana}}</span></span><span role="cell" style="{{ofn.sogiStyle}}">{{ofn.sogi}}</span><span role="cell">{{ofn.venue}}</span><span role="cell"><span style="{{ofn.unsetStyle}}">{{ofn.unset}}</span></span></div></sc-for>
<sc-if value="{{oFuneralsEmpty}}" hint-placeholder-val="{{ false }}"><div style="padding: 28px 18px; text-align: center; font-size: 14px; color: #4A5260">該当する葬家はありません</div></sc-if>
</div></div>
</section>
</sc-if>

<sc-if value="{{oShowDetail}}" hint-placeholder-val="{{ false }}">
<div style="padding-top: 20px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><a href="#" onClick="{{oBack}}" style="font-size: 13px; color: #2F4A6E">← 葬家一覧に戻る</a><h1 style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 24px; font-weight: 700">{{oSelName}} 様　注文リスト</h1><span class="hint">{{oSelInfo}}</span></div>
<sc-if value="{{oNoForm}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{oNew}}" style="min-height: 44px; padding: 0 22px; border-radius: 8px; border: none; background: {{accent}}; color: #2B3038; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">＋ 個別登録</button></sc-if>
</div>
<sc-if value="{{oNoForm}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; padding: 16px 20px; border-radius: 10px; background: #2F4A6E; color: #FFFFFF"><span style="font-size: 14px; font-weight: 700">合計（訃報経由＋個別登録、取消を除く）</span><span style="display: flex; align-items: baseline; gap: 20px; font-variant-numeric: tabular-nums"><span style="font-size: 15px">注文数 <span style="font-size: 24px; font-weight: 700">{{oTotalCount}}</span> 件</span><span style="font-size: 15px">合計金額 <span style="font-size: 24px; font-weight: 700">{{oTotalAmount}}</span></span></span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<div style="padding: 14px 16px; border-radius: 10px; display: flex; flex-direction: column; gap: 2px; background: #FBF3D6; border: 1px solid #E9C55A"><span style="font-size: 12px; font-weight: 700; color: #5E4A0E">未精算</span><span style="font-size: 20px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">{{oSumUnset}}</span></div>
<div style="padding: 14px 16px; border-radius: 10px; display: flex; flex-direction: column; gap: 2px; background: #FFFFFF; border: 1px solid #DCE1E8"><span class="hint">精算済み</span><span style="font-size: 20px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">{{oSumSet}}</span></div>
<div style="padding: 14px 16px; border-radius: 10px; display: flex; flex-direction: column; gap: 2px; background: #FFFFFF; border: 1px solid #DCE1E8"><span class="hint">精算不要（カード・請求書などメモリーノートの決済）</span><span style="font-size: 20px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">{{oSumNone}}</span></div>
</div>

</sc-if>
<sc-if value="{{oShowForm}}" hint-placeholder-val="{{ false }}"><section style="background: #FFFFFF; border: 2px solid #2F4A6E; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">{{oFormTitle}}</h2>
<p class="hint" style="margin: -8px 0 0">訃報経由ではなく、葬儀社に直接注文があった商品を登録します。管理システム内だけで管理し、訃報ページや名札生成には反映されません。</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 18px"><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">受付日時<span class="req">必須</span></span><input type="datetime-local" aria-label="at" data-o="at" value="{{od2.at}}" onChange="{{onO}}" placeholder=""></div><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">受付方法<span class="req">必須</span></span><select aria-label="受付方法" data-o="via" value="{{od2.via}}" onChange="{{onO}}"><option>電話</option><option>FAX</option><option>店頭</option><option>その他</option></select></div><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">注文者の区分<span class="req">必須</span></span><select aria-label="注文者の区分" data-o="ckind" value="{{od2.ckind}}" onChange="{{onO}}"><option>個人</option><option>法人</option></select></div></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 18px"><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">注文者 氏名（会社名）<span class="req">必須</span></span><input type="text" aria-label="cname" data-o="cname" value="{{od2.cname}}" onChange="{{onO}}" placeholder="例）株式会社○○ 総務部 ○○様"></div><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">電話番号<span class="req">必須</span></span><input type="tel" aria-label="ctel" data-o="ctel" value="{{od2.ctel}}" onChange="{{onO}}" placeholder=""></div><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">住所</span><input type="text" aria-label="caddr" data-o="caddr" value="{{od2.caddr}}" onChange="{{onO}}" placeholder=""></div></div>
<div style="display: grid; grid-template-columns: minmax(260px, 1.6fr) minmax(160px, 1fr); gap: 14px 18px"><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">商品<span class="req">必須</span></span><select aria-label="商品" data-o="item" value="{{od2.item}}" onChange="{{onOItem}}"><option value="">選択してください</option><option value="0001">供花（梅）１基（供花・16,500円）</option><option value="0002">供花（梅）１対（供花・33,000円）</option><option value="0003">供花（竹）１基（供花・22,000円）</option><option value="0005">供花（松）１基（供花・33,000円）</option><option value="0007">供花（追悼）１基（供花・55,000円）</option><option value="10000">枕花（供花・10,000円）</option><option value="1002">フルーツA（供物・10,800円）</option><option value="4000">菓子盛り（供物・4,000円）</option><option value="0009">哀悼 〜あいとう〜（弔文・3,300円）</option><option value="free">マスタにない商品（自由入力）</option></select><span class="hint">商品マスタから選ぶと、種別・単価・税率が入ります</span></div><sc-if value="{{oFree}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">商品名（自由入力）<span class="req">必須</span></span><input type="text" aria-label="iname" data-o="iname" value="{{od2.iname}}" onChange="{{onO}}" placeholder=""></div></sc-if></div>
<div style="display: grid; grid-template-columns: minmax(220px, 1.4fr) minmax(220px, 1.4fr); gap: 14px 18px"><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">札名<span class="req">必須</span></span><input type="text" aria-label="fuda" data-o="fuda" value="{{od2.fuda}}" onChange="{{onO}}" placeholder="例）株式会社○○ 代表取締役 ○○○○"></div><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">名札の備考</span><input type="text" aria-label="fnote" data-o="fnote" value="{{od2.fnote}}" onChange="{{onO}}" placeholder="例）「髙」ははしごだか"></div></div>
<div style="display: grid; grid-template-columns: 110px 160px 90px 170px minmax(160px, 1fr); gap: 14px 18px; align-items: end"><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">種別<span class="req">必須</span></span><select aria-label="種別" data-o="kind" value="{{od2.kind}}" onChange="{{onO}}"><option>供花</option><option>供物</option><option>弔文</option></select></div><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">単価（税込）<span class="req">必須</span></span><input type="number" min="0" aria-label="単価" data-o="unit" value="{{od2.unit}}" onChange="{{onO}}" style="text-align: right"></div><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">個数<span class="req">必須</span></span><input type="number" min="1" aria-label="個数" data-o="qty" value="{{od2.qty}}" onChange="{{onO}}" style="text-align: right"></div><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">金額（税込）</span><div style="min-height: 44px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; border-radius: 8px; background: #F5F7FA; border: 1px solid #DCE1E8; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{oAmount}}</div></div><div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">支払方法<span class="req">必須</span></span><select aria-label="支払方法" data-o="pay" value="{{od2.pay}}" onChange="{{onO}}"><option>現金</option><option>請求書</option><option>振込</option><option>後日精算</option></select></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">備考（社内用）</span><textarea aria-label="備考" data-o="memo" value="{{od2.memo}}" onChange="{{onO}}" style="min-height: 64px"></textarea></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px"><sc-if value="{{oIsEdit}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{oCancelOrder}}" style="margin-right: auto; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #B4443A; background: #FFFFFF; color: #9A2F26; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{oCancelOrderLabel}}</button></sc-if><span role="status" style="font-size: 13px; font-weight: 700; color: #B4231A">{{oErr}}</span><button type="button" onClick="{{oCancelForm}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038">やめる</button><button type="button" onClick="{{oSave}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; border: none; background: {{accent}}; color: #2B3038; font-weight: 700">{{oSaveLabel}}</button></div>
</section></sc-if>
<sc-if value="{{oNoForm}}" hint-placeholder-val="{{ true }}">

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; overflow: hidden">
<div style="overflow-x: auto"><div role="table" aria-label="注文リスト" style="min-width: 1440px; display: flex; flex-direction: column">
<div role="row" style="display: grid; grid-template-columns: 64px 150px 110px minmax(170px, 1.2fr) minmax(180px, 1.3fr) 50px 110px minmax(150px, 1fr) 90px 140px 120px; gap: 10px; padding: 12px 18px; background: #F5F7FA; border-bottom: 1px solid #DCE1E8; font-size: 12px; font-weight: 700; color: #4A5260"><span role="columnheader">区分</span><span role="columnheader">注文番号</span><span role="columnheader">受付日時</span><span role="columnheader">種別・商品</span><span role="columnheader">札名</span><span role="columnheader" style="text-align: right">個数</span><span role="columnheader" style="text-align: right">金額（税込）</span><span role="columnheader">注文者</span><span role="columnheader">支払</span><span role="columnheader">精算</span><span role="columnheader" aria-label="操作"></span></div>
<sc-for list="{{oItems}}" as="oi" hint-placeholder-count="3"><div role="row" style="{{oi.rowStyle}}">
<span role="cell"><span style="{{oi.badgeStyle}}">{{oi.src}}</span></span>
<span role="cell" style="font-variant-numeric: tabular-nums; color: #4A5260; font-size: 13px">{{oi.no}}</span>
<span role="cell" style="font-variant-numeric: tabular-nums; font-size: 13px">{{oi.at}}</span>
<span role="cell" style="display: flex; flex-direction: column; gap: 2px"><span class="hint">{{oi.kind}}</span><span style="font-weight: 700">{{oi.item}}</span><span class="hint">{{oi.opt}}</span></span>
<span role="cell" style="display: flex; flex-direction: column; gap: 2px"><span>{{oi.fuda}}</span><span class="hint">{{oi.fnote}}</span></span>
<span role="cell" style="text-align: right; font-variant-numeric: tabular-nums">{{oi.qty}}</span>
<span role="cell" style="text-align: right; font-variant-numeric: tabular-nums; font-weight: 700">{{oi.amount}}</span>
<span role="cell" style="display: flex; flex-direction: column; gap: 2px; font-size: 13px"><span>{{oi.cname}}</span><span class="hint">{{oi.ctel}}</span></span>
<span role="cell" style="font-size: 13px">{{oi.pay}}</span>
<span role="cell" style="display: flex; flex-direction: column; gap: 2px"><sc-if value="{{oi.needSettle}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{oi.toggleSettle}}" aria-pressed="{{oi.settled}}" style="{{oi.settleStyle}}">{{oi.settleLabel}}</button><span class="hint">{{oi.settledAt}}</span></sc-if><sc-if value="{{oi.noSettle}}" hint-placeholder-val="{{ false }}"><span class="hint">精算不要</span></sc-if></span>
<span role="cell" style="display: flex; flex-direction: column; gap: 4px"><span style="display: flex; gap: 6px"><sc-if value="{{oi.canEdit}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{oi.edit}}" style="min-height: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer">編集</button><button type="button" onClick="{{oi.openMenu}}" aria-haspopup="menu" aria-label="{{oi.menuAria}}" style="width: 34px; min-height: 34px; border-radius: 6px; border: 1px solid #C3CBD6; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 18px; font-weight: 700; line-height: 1; cursor: pointer">⋮</button></sc-if><sc-if value="{{oi.isWeb}}" hint-placeholder-val="{{ true }}"><span class="hint">閲覧のみ</span></sc-if></span><span class="hint" style="font-size: 11px">{{oi.issueText}}</span></span>
</div></sc-for>
<sc-if value="{{oItemsEmpty}}" hint-placeholder-val="{{ false }}"><div style="padding: 28px 18px; text-align: center; font-size: 14px; color: #4A5260">注文はまだありません</div></sc-if>
</div></div>
</section>
<p class="hint" style="margin: 0">訃報経由の注文は、供花連携でメモリーノートから届いた注文です（注文一覧取得APIで取りこぼしを補完）。現在の連携では取消・金額の変更が反映されないため、閲覧のみとしています。個別登録の注文と、訃報経由の「会場支払い」の注文は、代金を受け取ったら「未精算」を押して精算済みにします（もう一度押すと未精算に戻せます）。個別登録の注文は、取り消しても記録を残します。</p></sc-if>
</sc-if>
</sc-if>

<sc-if value="{{smsOpen}}" hint-placeholder-val="{{ false }}"><div style="position: fixed; inset: 0; z-index: 45; background: rgba(43,48,56,0.45); display: flex; align-items: center; justify-content: center; padding: 20px">
<div role="dialog" aria-modal="true" aria-labelledby="sms-h" style="width: min(460px, 100%); background: #FFFFFF; border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 id="sms-h" style="margin: 0; font-size: 18px; font-weight: 700">訃報をSMSで送る</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.7">{{smsTarget}} 様の訃報ページの案内を、入力した携帯電話番号へSMSで送ります。送信したSMSは取り消せません。</p>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="sms-to" class="fl">送信先の携帯電話番号</label><input id="sms-to" type="tel" inputmode="numeric" placeholder="09012345678（ハイフンなし）" value="{{smsTo}}" onChange="{{setSmsTo}}"><span class="hint">この葬家では残り{{smsLeft}}通まで送信できます（1葬家あたり10通）</span></div>
<span role="status" style="font-size: 13px; font-weight: 700; color: #B4231A">{{smsErr}}</span>
