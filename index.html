<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MELD（仮称） 葬儀管理システム ベース版｜メモリード様</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Noto+Serif+JP:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF1F5}
a{color:#2F4A6E}a:hover{color:#1E3352}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:10px;font-size:12px;font-weight:700;color:#4A5260;letter-spacing:0.04em}
.fl{font-size:13px;font-weight:700;color:#2B3038;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.req{display:inline-block;font-size:0;line-height:1;margin-left:-2px}.req::after{content:"*";font-size:16px;font-weight:700;color:#D0312D}.req-tmp::after{color:#1F6FD1}
.hint{font-size:12px;color:#5A6371;line-height:1.5}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{box-sizing:border-box;width:100%;min-height:44px;padding:8px 12px;border:1px solid #C3CBD6;border-radius:8px;background:#FFFFFF;color:#2B3038;font:inherit;font-size:14px}
input:disabled,select:disabled{background:#F1F3F6;color:#6B7380}
input[readonly]{background:#F5F7FA}
textarea{min-height:96px;resize:vertical}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:#2F4A6E;margin:0}
input:focus,select:focus,textarea:focus{outline:2px solid #2F4A6E;outline-offset:1px}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;color:#2B3038;cursor:pointer;align-self:flex-start;justify-self:start;width:fit-content;max-width:100%}
.unit{font-size:14px;color:#2B3038;flex:none}
.tag-obit{display:inline-flex;align-items:center;margin-left:4px;padding:0 6px;border-radius:4px;background:#E6EDF6;color:#1E3352;font-size:11px;font-weight:700;line-height:18px}
h2[id^="sec-"]{scroll-margin-top:240px}
@media (min-width: 900px){.side-menu{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
<template id="nexa-template"><div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif; color: #2B3038; background: #EEF1F5">

<nav class="side-menu" aria-label="メインメニュー" style="flex: 1 1 232px; max-width: 100%; background: #2B3038; color: #FFFFFF; padding: 28px 18px; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 10px">
<span style="font-size: 12px; color: #C9CED6">株式会社メモリード</span>
<span style="font-size: 24px; font-weight: 700; letter-spacing: 0.08em; line-height: 1.2">MELD<span style="font-size: 12px; font-weight: 400; letter-spacing: 0; margin-left: 4px; color: #C9CED6">（仮称）</span></span>
<span style="font-size: 13px; color: #D5D9DF">葬儀管理システム</span>
<span style="align-self: flex-start; margin-top: 6px; padding: 1px 8px; border-radius: 4px; border: 1px solid #6B7380; font-size: 11px; color: #D5D9DF">ベース版</span>
<span style="font-size: 11px; color: #AEB5C0; margin-top: 2px">funeral NEXA で開発</span>
</div>
<button type="button" onClick="{{goNewForm}}" style="min-height: 48px; border-radius: 10px; border: none; background: {{accent}}; color: #2B3038; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px">＋ 葬儀登録（新規）</button>
<div style="display: flex; flex-direction: column; gap: 4px">
<a href="#" onClick="{{goList}}" aria-current="{{listCur}}" style="{{navListStyle}}">施行一覧</a>
<a href="#" onClick="{{goOrders}}" aria-current="{{ordersCur}}" style="{{navOrdersStyle}}">供花・供物の注文登録</a>
<button type="button" onClick="{{toggleNavSet}}" aria-expanded="{{navSetOpen}}" style="{{navSetStyle}}"><span>設定</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{navSetArrow}}"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{navSetOpen}}" hint-placeholder-val="{{ true }}"><sc-for list="{{mNav}}" as="mn" hint-placeholder-count="3"><a href="#" onClick="{{mn.pick}}" aria-current="{{mn.cur}}" style="{{mn.style}}">{{mn.label}}</a></sc-for></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 14px 0 0; border-top: 1px dashed #5A626E">
<span style="padding: 0 14px; font-size: 12px; font-weight: 700; color: {{accent}}; letter-spacing: 0.08em">提案機能（案）</span>
<span style="padding: 2px 14px 8px; font-size: 11px; color: #AEB5C0; line-height: 1.5">作成した場合の画面イメージです</span>
<span style="padding: 4px 14px; font-size: 12px; font-weight: 700; color: #D5D9DF">① コールセンター受付</span>
<sc-for list="{{pNav1}}" as="pn" hint-placeholder-count="4"><a href="#" onClick="{{pn.pick}}" aria-current="{{pn.cur}}" style="{{pn.style}}">{{pn.label}}</a></sc-for>
<span style="padding: 10px 14px 4px; font-size: 12px; font-weight: 700; color: #D5D9DF">② 葬儀後のフォロー</span>
<sc-for list="{{pNav2}}" as="pn" hint-placeholder-count="2"><a href="#" onClick="{{pn.pick}}" aria-current="{{pn.cur}}" style="{{pn.style}}">{{pn.label}}</a></sc-for>
</div>
<div style="margin-top: auto; padding: 14px; border-radius: 10px; background: #353B45; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; color: {{accent}}">NEXAに相談</span>
<span style="font-size: 12px; color: #D5D9DF; line-height: 1.6">項目の追加・変更など、自社の運用に合わせた調整をチャットで相談できます。</span>
</div>
<div style="margin-top: 8px; padding: 12px 14px; border-radius: 10px; border: 1px dashed #5A626E; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #D5D9DF; line-height: 1.6">モックの入力内容は、このブラウザに保存されます。</span>
<button type="button" onClick="{{askReset}}" style="min-height: 36px; border-radius: 8px; border: 1px solid #8A93A1; background: transparent; color: #E3E6EB; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer">仮データに戻す</button>
</div>
</nav>

<main style="flex: 999 1 640px; min-width: 0; padding: 0 clamp(16px, 3vw, 40px) 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">

<div id="nexa-sticky" style="position: sticky; top: 0; z-index: 6; background: #EEF1F5; margin: 0 calc(-1 * clamp(16px, 3vw, 40px)); padding: 24px clamp(16px, 3vw, 40px) 14px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 12px -12px rgba(43,48,56,0.45)">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #5A6371"><a href="#" onClick="{{goList}}" style="color: #2F4A6E">施行一覧</a> › {{crumb}}</span>
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px"><h1 style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 26px; font-weight: 700; letter-spacing: 0.04em">葬儀登録</h1><span style="font-size: 13px; color: #4A5260">施行番号：<span style="font-weight: 700">保存時に自動採番</span></span><span style="font-size: 13px; color: #4A5260"><span aria-hidden="true" style="color: #D0312D; font-weight: 700; font-size: 16px">*</span> は必須項目です（<span aria-hidden="true" style="color: #1F6FD1; font-weight: 700; font-size: 16px">*</span> は一時保存にも必須／<span class="tag-obit">訃報</span> は訃報連携に必要）</span>
<sc-if value="{{isExisting}}" hint-placeholder-val="{{ false }}"><div style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; background: #FBF3D6; border: 1px solid #E9C55A; font-size: 12px; font-weight: 700; color: #5E4A0E"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #C98A0B"></span>伊藤 真由美 さんが葬家登録を編集中</span>
<span class="hint">最終更新：{{lastUpd}}</span>
<sc-if value="{{obitDirty}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; background: #FBF3D6; border: 1px solid #E9C55A; color: #5E4A0E; font-size: 12px; font-weight: 700">訃報に未反映の変更あり（葬家登録で再連携）</span></sc-if><sc-if value="{{recLinked}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{hdrPdf}}" style="min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">訃報紙PDF</button><button type="button" onClick="{{hdrSms}}" style="min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">SMS送信</button></sc-if>
<button type="button" onClick="{{goOrdersForThis}}" style="min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">注文リスト</button>
<button type="button" onClick="{{openHistory}}" style="min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">更新履歴</button>
<sc-if value="{{hasOps}}" hint-placeholder-val="{{ true }}"><div style="position: relative">
<button type="button" onClick="{{toggleOps}}" aria-expanded="{{showOps}}" aria-haspopup="menu" style="min-height: 36px; padding: 0 12px 0 14px; border-radius: 8px; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px">その他の操作<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{showOps}}" hint-placeholder-val="{{ false }}"><div role="menu" style="position: absolute; right: 0; top: calc(100% + 6px); z-index: 12; min-width: 200px; padding: 6px; border-radius: 10px; background: #FFFFFF; border: 1px solid #C3CBD6; box-shadow: 0 10px 24px rgba(43,48,56,0.18); display: flex; flex-direction: column">
<sc-if value="{{canMove}}" hint-placeholder-val="{{ true }}"><button type="button" role="menuitem" onClick="{{openMove}}" style="min-height: 42px; padding: 0 12px; border: none; border-radius: 6px; background: transparent; color: #2B3038; font: inherit; font-size: 14px; text-align: left; cursor: pointer">他社へ移行</button></sc-if>
<sc-if value="{{notCanceled}}" hint-placeholder-val="{{ true }}"><button type="button" role="menuitem" onClick="{{openCancel}}" style="min-height: 42px; padding: 0 12px; border: none; border-radius: 6px; background: transparent; color: #9A2F26; font: inherit; font-size: 14px; font-weight: 700; text-align: left; cursor: pointer">受付を取り消す</button></sc-if>
</div></sc-if>
</div></sc-if>
</div></sc-if></div>
</div>
<nav aria-label="登録のステータス" style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 10px 12px; overflow-x: auto">
<div style="display: flex; min-width: 680px">
<sc-for list="{{flow}}" as="st" hint-placeholder-count="4">
<button type="button" aria-current="{{st.ariaCurrent}}" onClick="{{st.pick}}" style="{{st.style}}"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700"><sc-if value="{{st.done}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>{{st.no}}. {{st.label}}</span><sc-if value="{{st.hasStatus}}" hint-placeholder-val="{{ false }}"><span style="{{st.subStyle}}">{{st.status}}</span></sc-if></button>
</sc-for>
</div>
</nav>
<sc-if value="{{isMain}}" hint-placeholder-val="{{ false }}"><nav aria-label="葬家登録の項目" style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 2px; padding: 0 6px; border-bottom: 1px solid #8A96A8">
<sc-for list="{{secTabs}}" as="sc" hint-placeholder-count="8"><a href="{{sc.href}}" onClick="{{sc.pick}}" aria-current="{{sc.current}}" style="{{sc.style}}">{{sc.label}}</a></sc-for>
</nav></sc-if>
</div>

<sc-if value="{{isNewForm}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; border-radius: 10px; background: #FBF3D6; border: 1px solid #E9C55A; color: #2B3038"><span style="font-size: 14px; font-weight: 700">新規受付：逝去登録のみ入力します</span><span style="font-size: 13px; line-height: 1.7">保存すると施行一覧に追加されます。搬送登録・葬家登録は、施行一覧から該当の葬家を選んで入力します。</span></div></sc-if>

<sc-if value="{{showMove}}" hint-placeholder-val="{{ false }}"><section role="dialog" aria-labelledby="move-h" style="background: #FFFFFF; border: 2px solid #2F4A6E; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px">
<h2 id="move-h" style="margin: 0; font-size: 17px; font-weight: 700">他社へ移行する</h2>
<p class="hint" style="margin: -8px 0 0">ご遺族が他社に葬儀を依頼された場合に記録します。入力済みの内容は残り、葬家登録は閲覧のみになります。</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 16px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="mv-at" class="fl">移行日時<span class="req">必須</span></label><input id="mv-at" type="datetime-local" value="{{mvAt}}" onChange="{{setMvAt}}"><span class="hint">他社へ依頼すると連絡があった日時</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="mv-to" class="fl">引き渡し先の葬儀社<span class="req">必須</span></label><input id="mv-to" type="text" placeholder="例）△△葬祭株式会社" value="{{mvTo}}" onChange="{{setMvTo}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="mv-person" class="fl">ご担当者</label><input id="mv-person" type="text" data-k="f1" value="{{fv.f1}}" onChange="{{onF}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="mv-tel" class="fl">連絡先</label><input id="mv-tel" type="tel" data-k="f2" value="{{fv.f2}}" onChange="{{onF}}"></div>
</div>
<fieldset><legend>引き渡し方法</legend>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px"><sc-for list="{{mvMethodOpts}}" as="mo" hint-placeholder-count="2"><label class="chk"><input type="radio" name="mv-method" checked="{{mo.on}}" onChange="{{mo.pick}}">{{mo.label}}</label></sc-for></div>
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 280px; margin-top: 6px"><label for="mv-hand" class="fl">引き渡し日時</label><input id="mv-hand" type="datetime-local" data-k="f3" value="{{fv.f3}}" onChange="{{onF}}"></div>
</fieldset>
<fieldset><legend>死亡診断書（原本）</legend>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px"><sc-for list="{{mvCertOpts}}" as="mc" hint-placeholder-count="2"><label class="chk"><input type="radio" name="mv-cert" checked="{{mc.on}}" onChange="{{mc.pick}}">{{mc.label}}</label></sc-for></div>
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 420px; margin-top: 6px"><label for="mv-cert-to" class="fl">渡した相手</label><input id="mv-cert-to" type="text" placeholder="例）△△葬祭 ご担当 ○○様" data-k="f4" value="{{fv.f4}}" onChange="{{onF}}"></div>
</fieldset>
<fieldset><legend>請求</legend>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px"><sc-for list="{{mvBillOpts}}" as="mb" hint-placeholder-count="2"><label class="chk"><input type="radio" name="mv-bill" checked="{{mb.on}}" onChange="{{mb.pick}}">{{mb.label}}</label></sc-for></div>
<sc-if value="{{mvBillYes}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; margin-top: 4px"><span class="fl">請求先</span><sc-for list="{{mvBillToOpts}}" as="mt" hint-placeholder-count="2"><label class="chk"><input type="radio" name="mv-bill-to" checked="{{mt.on}}" onChange="{{mt.pick}}">{{mt.label}}</label></sc-for></div></sc-if>
<p class="hint" style="margin: 6px 0 0">請求する品目（搬送料金・安置料・ドライアイスなど）と金額は、見積登録で検討中です。</p>
</fieldset>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px"><button type="button" onClick="{{closeMove}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 14px; cursor: pointer">やめる</button><button type="button" onClick="{{doMove}}" style="min-height: 44px; padding: 0 22px; border-radius: 8px; border: none; background: #2F4A6E; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">他社へ移行する</button></div>
</section></sc-if>
<sc-if value="{{moved}}" hint-placeholder-val="{{ false }}"><section style="display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 12px; background: #EEF2F8; border: 1px solid #B9C9DD">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px"><span style="font-size: 14px; color: #1E3352"><span style="font-weight: 700">他社へ移行済み：</span>{{mvSummary}}</span><button type="button" onClick="{{undoMove}}" style="min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 13px; cursor: pointer">移行を元に戻す</button></div>
<sc-if value="{{mvBySelf}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; color: #1E3352">自社で引き渡し先へ搬送するため、搬送登録に「安置先 → 引き渡し先」の搬送を追加してください。<button type="button" onClick="{{addHandover}}" style="min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">搬送を追加して開く</button></div></sc-if>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 10px; background: #FFFFFF; border: 1px solid {{mvDelBorder}}">
<span style="font-size: 14px; font-weight: 700">メモリーノートの訃報ページ・供花の受付を停止</span>
<span style="font-size: 13px; line-height: 1.6">他社で施行される葬儀の供花・供物の注文を受けないよう、葬家削除APIでメモリーノートの葬家を削除します。</span>
<sc-if value="{{mvNotLinked}}" hint-placeholder-val="{{ false }}"><span class="hint">訃報は未連携のため、メモリーノートへの操作はありません。</span></sc-if><sc-if value="{{mvLinked}}" hint-placeholder-val="{{ true }}"><div><button type="button" onClick="{{mvDelete}}" disabled="{{mvDeleted}}" style="min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #9A2F26; background: #FFFFFF; color: #9A2F26; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">メモリーノートの葬家を削除する</button></div></sc-if>
<span role="status" class="hint">{{mvDelText}}</span>
</div>
</section></sc-if>
<sc-if value="{{showCancel}}" hint-placeholder-val="{{ false }}"><section role="dialog" aria-labelledby="cancel-h" style="background: #FFFFFF; border: 2px solid #B4443A; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="cancel-h" style="margin: 0; font-size: 17px; font-weight: 700">この受付を取り消しますか？</h2>
<p class="hint" style="margin: 0">{{cancelObitNote}}取り消した受付は一覧の初期表示から外れ、進み具合の「取消」で確認できます。データは削除されず、元に戻すこともできます。</p>
<div role="radiogroup" aria-label="取り消しの理由" style="display: flex; flex-direction: column">
<sc-for list="{{cancelReasons}}" as="cr" hint-placeholder-count="4"><label class="chk"><input type="radio" name="cancel-r" checked="{{cr.on}}" onChange="{{cr.pick}}">{{cr.label}}</label></sc-for>
</div>
<textarea aria-label="取り消しの詳細（任意）" placeholder="詳細（任意）" style="min-height: 64px" data-k="f5" value="{{fv.f5}}" onChange="{{onF}}"></textarea>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px"><button type="button" onClick="{{closeCancel}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 14px; cursor: pointer">やめる</button><button type="button" onClick="{{doCancel}}" style="min-height: 44px; padding: 0 22px; border-radius: 8px; border: none; background: #9A2F26; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">取り消す</button></div>
</section></sc-if>
<sc-if value="{{canceled}}" hint-placeholder-val="{{ false }}"><div role="status" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-radius: 10px; background: #FBEAEA; border: 1px solid #D9A3A0; color: #7A2620"><span style="font-size: 14px"><span style="font-weight: 700">この受付は取り消し済みです。</span>理由：{{cancelReason}}</span><span style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" onClick="{{undoCancel}}" style="min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #D9A3A0; background: #FFFFFF; color: #7A2620; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">取り消しを元に戻す</button><button type="button" onClick="{{openDelete}}" style="min-height: 36px; padding: 0 14px; border-radius: 8px; border: none; background: #9A2F26; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">完全に削除（管理者のみ）</button></span></div></sc-if>
<sc-if value="{{showDelete}}" hint-placeholder-val="{{ false }}"><section role="dialog" aria-labelledby="del-h" style="background: #FFFFFF; border: 2px solid #9A2F26; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px">
<h2 id="del-h" style="margin: 0; font-size: 17px; font-weight: 700">受付を完全に削除</h2>
<p class="hint" style="margin: -6px 0 0">削除すると元に戻せません。「誰が・いつ・どの施行番号を・どの理由で削除したか」だけを操作記録に残し、個人情報は残しません。</p>
<fieldset><legend>削除できる条件</legend>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{delChecks}}" as="dc" hint-placeholder-count="4"><div style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span aria-hidden="true" style="{{dc.iconStyle}}">{{dc.icon}}</span><span>{{dc.label}}</span><span style="{{dc.stateStyle}}">{{dc.state}}</span></div></sc-for>
</div>
<sc-if value="{{delBlocked}}" hint-placeholder-val="{{ false }}"><p style="margin: 10px 0 0; font-size: 13px; font-weight: 700; color: #B4231A">条件を満たしていないため削除できません。取り消しの状態で保管してください。</p></sc-if>
</fieldset>
<sc-if value="{{delAllowed}}" hint-placeholder-val="{{ true }}">
<fieldset><legend>削除の理由</legend><div style="display: flex; flex-wrap: wrap; gap: 4px 24px"><sc-for list="{{delReasonOpts}}" as="dr" hint-placeholder-count="4"><label class="chk"><input type="radio" name="del-r" checked="{{dr.on}}" onChange="{{dr.pick}}">{{dr.label}}</label></sc-for></div></fieldset>
<p class="hint" style="margin: 0">ご遺族からの依頼の場合は、受付ごと消さずに、氏名・住所などの個人情報だけを消す方法もあります（件数の集計が合わなくなるのを防げます）。</p>
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 360px"><label for="del-no" class="fl">確認のため施行番号を入力</label><input id="del-no" type="text" autocomplete="off" placeholder="{{openNo}}" value="{{delTyped}}" onChange="{{setDelTyped}}"></div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px"><button type="button" onClick="{{closeDelete}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 14px; cursor: pointer">やめる</button><button type="button" onClick="{{doDelete}}" disabled="{{delDisabled}}" style="{{delBtnStyle}}">完全に削除する</button></div>
</section></sc-if>
<sc-if value="{{isTransferOnly}}" hint-placeholder-val="{{ false }}"><div style="padding: 12px 16px; border-radius: 10px; background: #E6EDF6; border: 1px solid #B9C9DD; color: #1E3352; font-size: 14px"><span style="font-weight: 700">搬送のみの受付です（他社で施行）。</span>葬家登録・見積登録は対象外です。搬送登録まで入力すると完了になります。</div></sc-if>

<!-- ============ 1 逝去登録 ============ -->
<sc-if value="{{isFirst}}" hint-placeholder-val="{{ true }}">

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 22px">
<h2 style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; align-items: baseline; gap: 12px"><span style="color: #2F4A6E">01</span>受付情報</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="b-recv" class="fl">受付日時<span class="req req-tmp">一時保存にも必須</span></label><input id="b-recv" type="datetime-local" value="{{recvAt}}" onChange="{{setRecvAt}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="b-route" class="fl">受付経路</label><select id="b-route" data-k="f6" value="{{fv.f6}}" onChange="{{onF}}"><option>電話</option><option>来館</option><option>病院・施設からの紹介</option><option>事前相談から</option><option>その他</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="b-type" class="fl">受付区分<span class="req">必須</span></label><select id="b-type" value="{{receptType}}" onChange="{{setReceptType}}"><option value="葬儀">葬儀（自社で施行予定）</option><option value="搬送のみ">搬送のみ（他社で施行）</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="fl" id="rs-l">受付担当者</span>
<sc-if value="{{rsView}}" hint-placeholder-val="{{ true }}"><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 6px 0 12px; border-radius: 8px; background: #F5F7FA; border: 1px solid #DCE1E8"><span style="font-size: 14px; font-weight: 700">{{recvStaff}}</span><button type="button" onClick="{{rsEdit}}" aria-describedby="rs-l" style="min-height: 34px; padding: 0 12px; border-radius: 6px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">変更</button></div></sc-if>
<sc-if value="{{rsEditing}}" hint-placeholder-val="{{ false }}"><div style="position: relative; display: flex; gap: 6px">
<input type="text" aria-label="受付担当者を検索" autocomplete="off" placeholder="名前・ふりがなの一部で検索" value="{{qRs}}" onChange="{{setQRs}}">
<button type="button" onClick="{{rsCancel}}" style="flex: none; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 13px; cursor: pointer">取消</button>
<sc-if value="{{showRs}}" hint-placeholder-val="{{ false }}"><div role="listbox" aria-label="受付担当者の候補" style="position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 4; display: flex; flex-direction: column; padding: 4px; background: #FFFFFF; border: 1px solid #C3CBD6; border-radius: 10px; box-shadow: 0 8px 20px rgba(43,48,56,0.16); max-height: 260px; overflow-y: auto">
<sc-for list="{{rsHits}}" as="rh" hint-placeholder-count="3"><button type="button" role="option" onClick="{{rh.pick}}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; padding: 0 10px; border: none; border-radius: 6px; background: transparent; color: #2B3038; font: inherit; font-size: 14px; text-align: left; cursor: pointer"><span style="font-weight: 700">{{rh.name}}</span><span class="hint">{{rh.kana}}</span></button></sc-for>
<sc-if value="{{rsNoHit}}" hint-placeholder-val="{{ false }}"><span class="hint" style="padding: 10px">該当する担当者がいません</span></sc-if>
</div></sc-if>
</div></sc-if>
<span class="hint">{{rsHint}}</span></div>
</div>
<sc-if value="{{isTransferOnlyType}}" hint-placeholder-val="{{ false }}"><fieldset><legend>請求（搬送のみ）</legend>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px"><sc-for list="{{tBillOpts}}" as="tb" hint-placeholder-count="2"><label class="chk"><input type="radio" name="t-bill" checked="{{tb.on}}" onChange="{{tb.pick}}">{{tb.label}}</label></sc-for></div>
<sc-if value="{{tBillYes}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px"><span class="fl">請求先</span><sc-for list="{{tBillToOpts}}" as="tt" hint-placeholder-count="2"><label class="chk"><input type="radio" name="t-bill-to" checked="{{tt.on}}" onChange="{{tt.pick}}">{{tt.label}}</label></sc-for></div>
<div style="display: grid; grid-template-columns: minmax(220px, 1.4fr) minmax(140px, 0.7fr) minmax(260px, 2fr); gap: 14px 16px; margin-top: 8px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="tb-name" class="fl">請求先名<span class="req">必須</span></label><input id="tb-name" type="text" placeholder="例）△△葬祭株式会社 ご担当 ○○様" data-k="f7" value="{{fv.f7}}" onChange="{{onF}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="tb-zip" class="fl">郵便番号</label><input id="tb-zip" type="text" inputmode="numeric" placeholder="例）466-0064" value="{{tbZip}}" onChange="{{setTbZip}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="tb-addr" class="fl">住所<span class="req">必須</span></label><input id="tb-addr" type="text" placeholder="郵便番号から町名まで自動入力。番地以降を入力" value="{{tbAddr}}" onChange="{{setTbAddr}}"></div>
</div>
</sc-if>
<p class="hint" style="margin: 6px 0 0">請求する品目（搬送料金・安置料など）と金額は、見積登録で検討中です。</p>
</fieldset></sc-if>
</section>

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 22px">
<h2 style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; align-items: baseline; gap: 12px"><span style="color: #2F4A6E">02</span>連絡者</h2>
<fieldset><legend>ご逝去のご連絡をくださった方</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px 20px; max-width: 900px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c-name" class="fl">氏名<span class="req req-tmp">一時保存にも必須</span></label><input id="c-name" type="text" placeholder="例）山田 一郎" value="{{cName}}" onChange="{{setCName}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c-rel" class="fl">故人との関係</label><select id="c-rel" value="{{relC}}" onChange="{{setRelC}}"><option value="">選択してください</option><optgroup label="配偶者"><option>妻</option><option>夫</option></optgroup><optgroup label="子"><option>長男</option><option>長女</option><option>次男</option><option>次女</option><option>三男</option><option>三女</option><option>息子</option><option>娘</option></optgroup><optgroup label="子の配偶者"><option>息子の妻</option><option>娘の夫</option></optgroup><optgroup label="親"><option>父</option><option>母</option></optgroup><optgroup label="兄弟姉妹"><option>兄</option><option>弟</option><option>姉</option><option>妹</option></optgroup><optgroup label="孫・その他の親族"><option>孫</option><option>甥</option><option>姪</option><option>伯父・叔父</option><option>伯母・叔母</option><option>いとこ</option></optgroup><optgroup label="親族以外"><option>病院</option><option>介護施設</option><option>警察署</option><option>友人・知人</option><option>その他</option></optgroup></select><sc-if value="{{relCOther}}" hint-placeholder-val="{{ false }}"><input type="text" aria-label="故人との関係（自由入力）" placeholder="関係を入力" data-k="f8" value="{{fv.f8}}" onChange="{{onF}}"></sc-if></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c-tel" class="fl">電話番号<span class="req req-tmp">一時保存にも必須</span></label><input id="c-tel" type="tel" placeholder="例）090-1234-5678" value="{{cTel}}" onChange="{{setCTel}}"></div>
</div>
<label class="chk" style="margin-top: 6px"><input type="checkbox" checked="{{contactIsMoshu}}" onChange="{{toggleContactMoshu}}">この方が喪主になる予定（葬家登録の喪主欄に反映）</label>
</fieldset>
</section>

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 22px">
<h2 style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; align-items: baseline; gap: 12px"><span style="color: #2F4A6E">03</span>故人</h2>
<fieldset><legend>氏名</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; max-width: 640px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="d-sei" class="fl">姓</label><input id="d-sei" type="text" autocomplete="off" placeholder="例）山田" value="{{dSei}}" onChange="{{setDSei}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="d-mei" class="fl">名</label><input id="d-mei" type="text" placeholder="例）太郎" value="{{dMei}}" onChange="{{setDMei}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="d-sei-k" class="fl">ふりがな（姓）<span class="req req-tmp">一時保存にも必須</span></label><input id="d-sei-k" type="text" placeholder="例）やまだ" value="{{dSeiK}}" onChange="{{setDSeiK}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="d-mei-k" class="fl">ふりがな（名）<span class="req req-tmp">一時保存にも必須</span></label><input id="d-mei-k" type="text" placeholder="例）たろう" value="{{dMeiK}}" onChange="{{setDMeiK}}"></div>
</div>
<p class="hint" style="margin: 8px 0 0">漢字が分からない場合は、ふりがな（姓・名）だけで保存できます。施行一覧では、漢字が未入力の間もふりがなで表示されます。入力した内容は葬家登録の故人名に反映されます。姓またはふりがなを入力すると、会員・事前相談で登録済みの方が候補に出ます。</p>
<sc-if value="{{showSuggestD}}" hint-placeholder-val="{{ false }}">
<div role="listbox" aria-label="候補" style="margin-top: 8px; max-width: 900px; border: 1px solid #C3CBD6; border-radius: 10px; background: #FFFFFF; box-shadow: 0 6px 18px rgba(43,48,56,0.12); overflow: hidden">
<div style="padding: 8px 14px; font-size: 12px; color: #4A5260; background: #F7F9FB">会員・事前相談・過去の施行から候補</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="font-size: 14px; font-weight: 700">山田 太郎</span><span style="padding: 0 8px; border-radius: 4px; background: #FBF3D6; border: 1px solid #E9C55A; color: #5E4A0E; font-size: 11px; font-weight: 700; line-height: 20px">事前相談：危篤・待機中</span></span><span class="hint">○○病院 3階東病棟　連絡者：山田 一郎（長男）　受付：[相談日時]</span></span>
<button type="button" onClick="{{doLink}}" style="min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">この方の情報を呼び出す</button>
</div>
</div>
</sc-if>
<sc-if value="{{linked}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 8px; max-width: 900px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-radius: 10px; background: #E6EDF6; color: #1E3352; font-size: 13px; line-height: 1.6">
<span><span style="font-weight: 700">引き継ぎ済み：</span>事前相談（危篤・待機中）[相談番号] の故人名・連絡者・お迎え先を反映しました。</span>
<button type="button" onClick="{{unlink}}" style="min-height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 13px; cursor: pointer">紐付けを解除</button>
</div>
</sc-if>
</fieldset>
<p class="hint" style="margin: -8px 0 0">死亡日時は、死亡診断書・死体検案書を確認してから葬家登録で入力します。</p>
</section>

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 22px">
<h2 style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; align-items: baseline; gap: 12px"><span style="color: #2F4A6E">04</span>搬送先</h2>
<fieldset><legend>お迎え先</legend>
<div style="display: grid; grid-template-columns: minmax(160px, 1fr) minmax(240px, 2fr) minmax(200px, 1fr); gap: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="d-place" class="fl">区分<span class="req">必須</span></label><select id="d-place" value="{{pickKind}}" onChange="{{setPickKind}}"><option>病院</option><option>自宅</option><option>介護施設</option><option>警察署</option><option>その他</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="d-place-name" class="fl">名称・住所<span class="req">必須</span></label><input id="d-place-name" type="text" placeholder="例）○○病院 3階東病棟" value="{{pickName}}" onChange="{{setPickName}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="d-pickup-dt" class="fl">お迎え予定日時</label><input id="d-pickup-dt" type="datetime-local" value="{{pickAt}}" onChange="{{setPickAt}}"></div>
</div></fieldset>
<label class="chk" style="margin-top: -8px"><input type="checkbox" checked="{{noTransfer}}" onChange="{{toggleNoTransfer}}">搬送なし（ご逝去場所でそのまま安置）</label>
<fieldset><legend>安置先</legend>
<sc-if value="{{noTransfer}}" hint-placeholder-val="{{ false }}"><div style="max-width: 900px; min-height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 8px; background: #F5F7FA; border: 1px solid #DCE1E8; font-size: 14px">お迎え先と同じ場所（ご逝去場所）に安置します</div></sc-if>
<sc-if value="{{hasTransfer}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: minmax(160px, 1fr) minmax(240px, 2fr) minmax(200px, 1fr); gap: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="t-kind" class="fl">区分<span class="req">必須</span></label><select id="t-kind" value="{{anchiKind}}" onChange="{{setAnchiKind}}"><option>自社安置室</option><option>自宅</option><option>式場</option><option>その他</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="t-anchi-name" class="fl">名称・住所<span class="req">必須</span></label><input id="t-anchi-name" type="text" placeholder="例）本館 安置室" value="{{anchiName}}" onChange="{{setAnchiName}}"></div>
</div>
</sc-if></fieldset>
<p class="hint" style="margin: -8px 0 0">お迎え先・安置先は搬送登録の経路に反映されます。寝台車のメーターや時刻は、ご安置後に搬送登録で入力できます。搬送なしの場合も、その後の搬送（安置先 → 式場など）は搬送登録で追加できます。</p>
</section>

<section style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
<h2 style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; align-items: baseline; gap: 12px"><span style="color: #2F4A6E">05</span>申し送り</h2>
<div style="display: grid; grid-template-columns: minmax(0, 3fr) minmax(200px, 1fr); gap: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="n-memo" class="fl">打合せ担当への申し送り</label><textarea id="n-memo" placeholder="例）ご遺族の要望、搬送時の状況、宗教・菩提寺について聞き取れたこと" value="{{memo}}" onChange="{{setMemo}}"></textarea></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">添付書類</span><button type="button" style="min-height: 44px; border-radius: 8px; border: 1px dashed #8A96A8; background: #F5F7FA; color: #2F4A6E; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">ファイルを追加</button><span class="hint">引き継ぎ書など</span></div>
</div>

<sc-if value="{{tp.asNoHit}}" hint-placeholder-val="{{ false }}"><span class="hint" style="padding: 10px">該当する担当者がいません</span></sc-if>
</div></sc-if>
</div>
</div>
</div>
</div>
<div style="overflow-x: auto">
<div role="table" aria-label="経路・時刻・メーター" style="min-width: 1070px; display: flex; flex-direction: column">
<div role="row" style="display: grid; grid-template-columns: 120px minmax(200px, 1fr) 210px 150px 180px 148px; gap: 12px; padding: 0 4px 8px; font-size: 12px; font-weight: 700; color: #4A5260">
<span role="columnheader">区分</span><span role="columnheader">場所</span><span role="columnheader">時刻（出庫・到着・帰庫）</span><span role="columnheader" style="text-align: right">メーター（km）</span><span role="columnheader" style="text-align: right">区間距離</span><span role="columnheader" aria-label="操作"></span>
</div>
<sc-for list="{{tp.rows}}" as="r" hint-placeholder-count="4">

<span role="cell"><sc-if value="{{r.isVia}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; gap: 4px"><button type="button" aria-label="この経由地を上へ移動" onClick="{{r.moveUp}}" disabled="{{r.noUp}}" style="{{r.upStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button><button type="button" aria-label="この経由地を下へ移動" onClick="{{r.moveDown}}" disabled="{{r.noDown}}" style="{{r.downStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button><button type="button" aria-label="この経由地を削除" onClick="{{r.remove}}" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #C3CBD6; background: #FFFFFF; color: #4A5260; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span></sc-if></span>
</div>
</sc-for>
</div></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px"><button type="button" onClick="{{tp.addVia}}" style="min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #2F4A6E; background: #FFFFFF; color: #2F4A6E; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">＋ 経由地を追加</button><button type="button" style="min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #8A96A8; background: #FFFFFF; color: #2B3038; font: inherit; font-size: 13px; cursor: pointer">住所から概算距離を計算</button></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px">
<span>運賃計算距離 <span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; color: #2F4A6E">{{tp.fareKm}}</span></span>
<span>回送 <span style="font-weight: 700; font-variant-numeric: tabular-nums">{{tp.deadKm}}</span></span>
<span>総走行 <span style="font-weight: 700; font-variant-numeric: tabular-nums">{{tp.totalKm}}</span></span>
</div>
</div>
</section>
</sc-for>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px; border: 1px dashed #8A96A8; border-radius: 12px; background: #FFFFFF">

</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-radius: 12px; background: #2F4A6E; color: #FFFFFF">

<sc-if value="{{isMain}}" hint-placeholder-val="{{ false }}">

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; max-width: 640px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-sei" class="fl">姓<span class="req">必須</span><span class="tag-obit" title="訃報連携に必要な項目">訃報</span></label><input id="m-sei" type="text" value="{{dSei}}" onChange="{{setDSei}}"></div>

<select aria-label="月" value="{{bMonth}}" onChange="{{setBMonth}}" style="width: 72px"><option value="">-</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select><span class="unit">月</span>
<sc-if value="{{bd28}}" hint-placeholder-val="{{ false }}"><select aria-label="日" value="{{bDay}}" onChange="{{setBDay}}" style="width: 72px"><option value="">-</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option></select></sc-if><sc-if value="{{bd29}}" hint-placeholder-val="{{ false }}"><select aria-label="日" value="{{bDay}}" onChange="{{setBDay}}" style="width: 72px"><option value="">-</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option></select></sc-if><sc-if value="{{bd30}}" hint-placeholder-val="{{ false }}"><select aria-label="日" value="{{bDay}}" onChange="{{setBDay}}" style="width: 72px"><option value="">-</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option></select></sc-if><sc-if value="{{bd31}}" hint-placeholder-val="{{ true }}"><select aria-label="日" value="{{bDay}}" onChange="{{setBDay}}" style="width: 72px"><option value="">-</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option></select></sc-if><span class="unit">日</span>

<div style="display: flex; flex-direction: column; gap: 6px"><span class="fl">満年齢（自動計算）</span><div style="min-height: 44px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 0 12px; border-radius: 8px; background: #F5F7FA; border: 1px solid #DCE1E8; font-size: 14px"><span style="font-weight: 700; font-variant-numeric: tabular-nums">{{ageText}}</span></div><span class="hint">{{ageBase}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-d-kazoe" class="fl">数え年（任意）</label><div style="display: flex; align-items: center; gap: 6px"><input id="m-d-kazoe" type="number" min="0" style="text-align: right" data-k="f11" value="{{fv.f11}}" onChange="{{onF}}"><span class="unit">歳</span></div></div>

<fieldset><legend>死亡日時（死亡診断書・死体検案書の記載どおり）</legend>

<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-d-ddate" class="fl">死亡日<span class="req">必須</span><span class="tag-obit" title="訃報連携に必要な項目">訃報</span></label><input id="m-d-ddate" type="date" value="{{deathDate}}" onChange="{{setDeathDate}}"><label class="chk"><input type="checkbox" checked="{{dateApprox}}" onChange="{{toggleDateApprox}}">日付は「頃」</label><sc-if value="{{dateApprox}}" hint-placeholder-val="{{ false }}"><select aria-label="日付の表し方" value="{{datePrec}}" onChange="{{setDatePrec}}"><option value="day">◯月◯日頃</option><option value="early">◯月上旬頃</option><option value="mid">◯月中旬頃</option><option value="late">◯月下旬頃</option></select><span class="hint">上旬・中旬・下旬の場合、上の日付はその月のどの日でも構いません</span></sc-if><sc-if value="{{precRange}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px; padding: 10px 12px; border-radius: 8px; background: #FBF3D6; border: 1px solid #E9C55A"><label for="m-d-obit" class="fl">訃報・四十九日の計算に使う日付<span class="req">必須</span></label><input id="m-d-obit" type="date" data-k="api_death" value="{{fv.api_death}}" onChange="{{onF}}"><span class="hint">検案書の推定日などを入力します。訃報には「頃」を付けずに日付だけを表示します。</span></div></sc-if></div>

</div>
</fieldset>

<fieldset><legend>死亡したところ（死亡診断書・死体検案書の記載どおり）</legend>
<div style="display: grid; grid-template-columns: minmax(200px, 1fr) minmax(200px, 1fr) minmax(260px, 2fr); gap: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-dp-kind" class="fl">種別</label><select id="m-dp-kind" data-k="f12" value="{{fv.f12}}" onChange="{{onF}}"><option>病院</option><option>診療所</option><option>介護医療院・介護老人保健施設</option><option>助産所</option><option>老人ホーム</option><option>自宅</option><option>その他</option></select></div>

<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-dp-addr" class="fl">所在地</label><input id="m-dp-addr" type="text" data-k="f14" value="{{fv.f14}}" onChange="{{onF}}"></div>
</div>
